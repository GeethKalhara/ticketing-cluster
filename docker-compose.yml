x-node: &node
  build: .
  image: ticketing-node
  restart: "no"

services:
  node1:
    <<: *node
    environment:
      NODE_ID: node1
      PEERS: "node2:8080,node3:8080,node4:8080,node5:8080"
    ports:
      - "8081:8080"

  node2:
    <<: *node
    environment:
      NODE_ID: node2
      PEERS: "node1:8080,node3:8080,node4:8080,node5:8080"
    ports:
      - "8082:8080"

  node3:
    <<: *node
    environment:
      NODE_ID: node3
      PEERS: "node1:8080,node2:8080,node4:8080,node5:8080"
    ports:
      - "8083:8080"

  node4:
    <<: *node
    environment:
      NODE_ID: node4
      PEERS: "node1:8080,node2:8080,node3:8080,node5:8080"
    ports:
      - "8084:8080"

  node5:
    <<: *node
    environment:
      NODE_ID: node5
      PEERS: "node1:8080,node2:8080,node3:8080,node4:8080"
    ports:
      - "8085:8080"